name: Tulasi AI — Production CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Backend Tests & Lint
  # ─────────────────────────────────────────────
  backend-ci:
    name: 🐍 Backend — Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint — Fatal errors only (syntax, undefined names)
        working-directory: backend
        run: |
          pip install flake8
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest suite
        working-directory: backend
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          DATABASE_URL: sqlite:///./test.db
          GOOGLE_API_KEY: ""
          GEMINI_API_KEY: ""
        run: |
          python -m pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────
  # JOB 2: Frontend Build
  # ─────────────────────────────────────────────
  frontend-ci:
    name: ⚡ Frontend — Build & Type-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit
        continue-on-error: true  # Type errors warn but don't block deploy

      - name: Production build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://tulasi-ai-soda.onrender.com' }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: frontend/.next/
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 3: Deploy (only on push to main)
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render backend deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Accept: application/json" | jq .

      - name: Trigger Vercel frontend deploy
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" \
            -H "Accept: application/json" | jq .

      - name: Deployment Summary
        run: |
          echo "✅ Tulasi AI deployed successfully!"
          echo "🌐 Frontend: https://www.tulasiai.in"
          echo "🔧 Backend:  https://tulasi-ai-soda.onrender.com"
